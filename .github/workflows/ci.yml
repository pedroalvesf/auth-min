name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  CI: true

jobs:
  # ─────────────────────────────────────────
  # Lint + format
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

  # ─────────────────────────────────────────
  # Unit tests
  # ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Unit tests
        run: pnpm exec jest --ci --maxWorkers=50%

  # ─────────────────────────────────────────
  # Build + E2E (com postgres)
  # ─────────────────────────────────────────
  e2e-tests:
    name: Build & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: auth_test_user
          POSTGRES_PASSWORD: auth_test_password
          POSTGRES_DB: auth_test_db
        ports:
          - 8239:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://auth_test_user:auth_test_password@localhost:8239/auth_test_db

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build application
        run: pnpm build

      - name: Push test schema
        run: pnpm dlx prisma db push --schema=./test/schema.prisma --force-reset

      - name: Generate Prisma test client
        run: pnpm prisma:generate:test

      - name: E2E tests
        run: pnpm test:e2e -- --ci --forceExit
