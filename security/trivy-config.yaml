# Trivy configuration file
# Documentation: https://aquasecurity.github.io/trivy/v0.45/docs/configuration/

# Global settings
cache:
  dir: .trivy-cache

# Database settings
db:
  repository: aquasec/trivy-db

# Scanning settings
scan:
  # Skip files/directories matching these patterns
  skip-files:
    - "node_modules/**"
    - ".git/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/test/**"
    - "coverage/**"
    - "dist/**"
    - "build/**"
    - ".trivy-cache/**"

# Vulnerability settings
vulnerability:
  # Only report vulnerabilities with these severity levels
  severity:
    - HIGH
    - CRITICAL
  
  # Ignore unfixed vulnerabilities
  ignore-unfixed: true
  
  # Vulnerability database settings
  type:
    - os
    - library

# Secret scanning settings
secret:
  # Skip secret scanning in these directories
  skip-dirs:
    - node_modules
    - .git
    - coverage
    - dist

# Misconfiguration scanning settings
misconfiguration:
  # Include these types of misconfigurations
  include-non-failures: false
  
  # Skip these checks
  skip-policy:
    - DS002  # Skip "rootless container" check for development
  
  # Custom policy directory
  policy: ./security/policies

# License scanning settings
license:
  # Only report these license types as issues
  forbidden:
    - GPL-2.0
    - GPL-3.0
    - AGPL-3.0

# Output format settings
format: table
template: "@contrib/html.tpl"

# Exit code settings
exit-code: 1  # Exit with code 1 if vulnerabilities found

# Timeout settings
timeout: 5m

# Debug settings
debug: false
quiet: false