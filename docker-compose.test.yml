services:
  postgres-test:
    image: postgres:15-alpine
    container_name: auth-postgres-test
    environment:
      POSTGRES_USER: auth_test_user
      POSTGRES_PASSWORD: auth_test_password
      POSTGRES_DB: auth_test_db
    ports:
      - "8239:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test_user -d auth_test_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-min-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-min-test
    ports:
      - "3001:3001"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://auth_test_user:auth_test_password@postgres-test:5432/auth_test_db
      JWT_SECRET: test-jwt-secret-key-with-32-characters-minimum
      PORT: 3001
      SECRET_ENCRYPTION_KEY: test-encryption-key